# Per-function verify_jwt, recording the CURRENT live state: every function
# in supabase/functions is deployed with verify_jwt = false because they are
# invoked by DB triggers and pg_cron with a service-role key (and by the
# storefront/marketplace with the anon key), NOT by end-user JWTs. Without
# these blocks a bulk `supabase functions deploy` would default them to true
# and 401 every one of those callers. Do not flip a value here without also
# changing the function's auth model. The deploy workflow's preflight fails
# if any function directory is missing its block.

